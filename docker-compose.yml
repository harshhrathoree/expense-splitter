services:
  backend:
    build:
      context: ./backend

    container_name: expense-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend

    container_name: expense-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  redis:
    image: redis:7-alpine

    container_name: expense-redis

    ports:
      - "6379:6379"